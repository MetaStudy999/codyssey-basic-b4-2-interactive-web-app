name: B4-2 CI

on:
  pull_request:
  push:
    branches: [main, mission/b4-2]

permissions:
  contents: write
  pages: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify structure
        run: npm run verify
      - name: Unit/component tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Prepare GitHub Pages runtime bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/mission/b4-2'
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil

          index = Path('dist/index.html')
          html = index.read_text(encoding='utf-8')
          runtime = (
              '<base href="/codyssey-basic-b4-2-interactive-web-app/">'
              '<script src="https://metyfpxbqoxfuhkuupyd.supabase.co/functions/v1/b4-2-app/config.js"></script>'
          )
          html = html.replace('<head>', '<head>' + runtime, 1)
          index.write_text(html, encoding='utf-8')
          shutil.copyfile(index, 'dist/404.html')
          PY
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: b4-2-dist
          path: dist/
          if-no-files-found: error
      - name: Publish runtime bundle branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/mission/b4-2'
        run: |
          publish_dir="$RUNNER_TEMP/b4-2-runtime-dist"
          rm -rf "$publish_dir"
          mkdir -p "$publish_dir"
          cp -R dist/. "$publish_dir/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan runtime-dist
          git rm -rf .
          git clean -fdx
          cp -R "$publish_dir"/. .
          touch .nojekyll
          git add -A
          git commit -m "chore: publish runtime bundle ${GITHUB_SHA}"
          git push --force origin HEAD:runtime-dist
      - name: Enable GitHub Pages from runtime-dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/mission/b4-2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          current=$(curl -sS -o "$RUNNER_TEMP/pages-get.json" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api")

          if [ "$current" = "404" ]; then
            created=$(curl -sS -o "$RUNNER_TEMP/pages-create.json" -w '%{http_code}' \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api" \
              -d '{"source":{"branch":"runtime-dist","path":"/"}}')
            cat "$RUNNER_TEMP/pages-create.json"
            test "$created" = "201"
          else
            cat "$RUNNER_TEMP/pages-get.json"
            test "$current" = "200"
          fi
